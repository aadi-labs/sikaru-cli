name: Verify CLI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo test --locked --bin sikaru --test sdk_retry_policy
      - run: cargo build --locked --bin sikaru
      - run: node scripts/check-cli.mjs target/debug/sikaru
      - name: Verify local compute and generated CLI transport
        env:
          SIKARU_TEST_CLI: ${{ github.workspace }}/target/debug/sikaru
        run: python -m unittest discover -s tests -p test_local_compute.py -v
      - name: Verify installable compute command
        run: |
          python -m pip install --no-deps ./client-extensions/cli
          sikaru-compute --help
