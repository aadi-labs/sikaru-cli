name: Verify CLI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo test --locked --bin sikaru --test sdk_retry_policy --test auto_improve --test event_stream --test execution_environment --test compute_executor --test compute_recovery --test compute_contract --test compute_workflows --test compute_worker
      - run: cargo build --locked --bin sikaru
      - run: node scripts/check-cli.mjs target/debug/sikaru
      - name: Verify installed native compute package
        run: |
          cargo install --locked --debug --path . --root "$RUNNER_TEMP/sikaru-installed"
          SIKARU_TEST_INSTALLED="$RUNNER_TEMP/sikaru-installed/bin/sikaru" cargo test --locked --test compute_packaged_acceptance
      - name: Verify authoring companion
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo test --locked --manifest-path client-extensions/authoring/Cargo.toml
          cargo install --locked --debug --path client-extensions/authoring
          sikaru-authoring --help
