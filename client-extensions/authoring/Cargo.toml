[package]
name = "sikaru-authoring"
version = "0.1.0"
edition = "2021"
description = "Source authoring companion for the generated Sikaru CLI"
license = "Apache-2.0"
publish = false

[[bin]]
name = "sikaru-authoring"
path = "src/main.rs"

[dependencies]
fern_cli_sdk = { package = "sikaru-cli", path = "../.." }
base64 = "0.22"
clap = { version = "4", features = ["string"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
