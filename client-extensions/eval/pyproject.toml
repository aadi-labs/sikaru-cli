[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sikaru-eval"
version = "0.1.0"
description = "Harbor and Pier agents for the Sikaru CLI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

[project.optional-dependencies]
harbor = ["harbor==0.22.0"]
pier = ["datacurve-pier==0.3.1"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
